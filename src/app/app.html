<div class="page">
  <header class="topbar">
    <a class="brand-mark" href="#inicio" aria-label="Ir al inicio">JE<span>.</span></a>
    <button
      class="theme-toggle"
      type="button"
      (click)="toggleTheme()"
      [attr.aria-pressed]="theme() === 'dark'"
    >
      {{ theme() === 'dark' ? '☀️ Tema claro' : '🌙 Tema oscuro' }}
    </button>
  </header>

  <main class="content" id="inicio">
    <section class="profile-card" aria-label="Perfil profesional">
      <app-header></app-header>
    </section>

    <app-work-experience></app-work-experience>
    <app-skills></app-skills>
    <app-education></app-education>
    <app-certificates></app-certificates>
    <app-languages></app-languages>
    <app-interests></app-interests>
  </main>
</div>
